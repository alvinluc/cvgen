[project]
name = "cv-generator"
version = "0.1.0"
description = "Generate CV and cover letter PDFs/DOCX files from TOML inputs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cv-generator = "cv_generator:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cv_generator"]
