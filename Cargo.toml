[package]
name = "cv-generator"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Generate CV and cover letter PDFs/DOCX files from TOML inputs."
readme = "README.md"
license = "Apache-2.0"

[[bin]]
name = "cv-generator"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
time = { version = "0.3", default-features = false, features = ["std"] }
toml = "1.1"
typst = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
typst-layout = "0.15"
typst-pdf = "0.15"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
