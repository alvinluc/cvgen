name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      # Only once: the check is platform-independent, and running it on both
      # would just double the chance of a spurious line-ending disagreement.
      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --logger 'console;verbosity=normal'

  publish:
    name: Publish ${{ matrix.rid }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            exe: ''
          - rid: win-x64
            os: windows-latest
            exe: '.exe'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish CvGenerator -c Release -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:PublishTrimmed=true
          -p:TrimMode=full
          -o artifacts

      # "Single file" is a claim that quietly stops being true: a package
      # shipping a native library or a content file drops it beside the binary
      # and the publish still succeeds. Count the output instead of trusting it.
      - name: Check the publish is a single file
        shell: bash
        run: |
          set -euo pipefail
          find artifacts -type f
          count=$(find artifacts -type f | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected one published file, found $count"
            exit 1
          fi

      # TrimMode=full is the reason this step exists. A trimmed build can
      # restore, build and unit-test cleanly and still fail at run time if the
      # linker removed something the renderers reach for, so drive the actual
      # binary end to end over both document types.
      - name: Smoke-test the published binary
        shell: bash
        run: |
          set -euo pipefail
          ./artifacts/cv-generator${{ matrix.exe }} john-doe pdf
          ./artifacts/cv-generator${{ matrix.exe }} john-doe docx
          ./artifacts/cv-generator${{ matrix.exe }} john-doe ats
          ./artifacts/cv-generator${{ matrix.exe }} john-doe-cover pdf
          ls -l output/

      - uses: actions/upload-artifact@v4
        with:
          name: cv-generator-${{ matrix.rid }}
          path: artifacts/
          if-no-files-found: error
